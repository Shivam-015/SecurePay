apiVersion: v1
kind: Service
metadata:
  name: securepay-redis
  namespace: securepay
spec:
  selector:
    app: securepay-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securepay-redis
  namespace: securepay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securepay-redis
  template:
    metadata:
      labels:
        app: securepay-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: securepay-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: securepay-redis-data
  namespace: securepay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
